name: Mensageiro (totais do hub)

on:
  schedule:
    - cron: "47 11 * * *"   # 08:47 em Brasília — depois de deputados e senadores
    - cron: "7 15 * * *"    # 12:07 — depois do robô dos municípios (TCE)
    - cron: "37 21 * * *"   # 18:37 — rodada de reforço
  workflow_dispatch:         # botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: mensageiro
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Juntar os totais dos três sites
        # a rodada das 12:07 (e o botão) faz também a parte pesada: notas da semana, fornecedores e CNPJ
        run: |
          if [ "${{ github.event.schedule }}" = "7 15 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python robo/mensageiro.py --completo
          else
            python robo/mensageiro.py
          fi
      - name: Índice de transparência
        # se falhar, o arquivo anterior fica no ar (não impede os totais)
        run: |
          python robo/indice.py || echo "indice falhou, arquivo anterior mantido"
      - name: Publicar
        run: |
          git config user.name  "robo-quanto-custa"
          git config user.email "actions@users.noreply.github.com"
          git add dados
          if ! git diff --cached --quiet; then
            git commit -m "hub: totais de $(date -u +%Y-%m-%d)"
            # tenta salvar até 5 vezes (o GitHub recusa se outro envio chegou no mesmo instante)
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main || true
              if git push; then break; fi
              echo "Envio recusado; nova tentativa em $((i*20)) s"; sleep $((i*20))
              [ $i = 5 ] && exit 1
            done
          fi
